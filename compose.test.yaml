services:
  caddy:
    ports: !override
      - target: 443
        host_ip: 127.0.0.1

  db-smoke:
    image: postgres:19.0-trixie
    profiles:
      - test
    entrypoint: ["/bin/sh", "/setup/db-smoke.sh"]
    environment:
      PGHOST: db
      PGDATABASE: hatchlane
    secrets:
      - db_migrator
      - db_app
    volumes:
      - ./tests/db-smoke.sh:/setup/db-smoke.sh:ro
    networks:
      - database
